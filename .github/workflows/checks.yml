name: "Nix CI"
on:
    pull_request:
    push:
        branches: [main]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Nothing but nix
              if: ${{ runner.os == 'Linux' && inputs.ONLY_NIX != 'true' }}
              uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874 # main
              with:
                  hatchet-protocol: rampage
                  root-safe-haven: 2048

            - name: Install nix
              uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

            - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main

            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Run Nix Fast Build
              run: |
                  nix run nixpkgs#nix-fast-build -- \
                    --skip-cached \
                    --no-nom \
                    --flake ".#checks.x86_64-linux"
