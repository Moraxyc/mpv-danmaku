name: Build danmaku

on:
    workflow_dispatch:
    push:
        tags:
            - v*
        paths-ignore:
            - "*.md"
            - "LICENSE"
            - ".gitignore"
            - ".github/**"

jobs:
    build-release:
        env:
            RUST_BACKTRACE: full
        strategy:
            matrix:
                include:
                    - arch: x86_64-windows-gnu
                      os: windows-latest
                      artifact: danmaku.dll
                    - arch: x86_64-linux-gnu
                      os: ubuntu-latest
                      artifact: danmaku.so

        runs-on: ${{matrix.os}}
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

            - name: Build danmaku-${{ matrix.arch }}
              if: ${{ matrix.os == 'ubuntu-latest' }}
              run: |
                  cargo b -r
                  cp target/release/libmpv_danmaku.so danmaku.so
                  mv target/release/libmpv_danmaku.so target/release/danmaku.so
                  tar -czf danmaku-${{ matrix.arch }}.tar.gz danmaku.so

            - name: Build danmaku-${{matrix.arch}}
              if: ${{ matrix.os == 'windows-latest' }}
              run: |
                  cargo b -r
                  cp target/release/mpv_danmaku.dll danmaku.dll
                  7z a danmaku-${{ matrix.arch }}.7z danmaku.dll

            - name: Upload
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: danmaku-${{ matrix.arch }}
                  path: ${{ matrix.artifact }}
                  retention-days: 3
                  if-no-files-found: error

            - name: Get latest tag name
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              id: tag
              run: echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

            - name: Release
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: |
                      *.7z
                      *.tar.gz
                  tag_name: ${{ steps.tag.outputs.TAG_NAME }}
